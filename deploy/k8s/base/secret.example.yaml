# NÃO é aplicado pelo kustomize. Crie o Secret por fora (ver deploy/k8s/README.md) ou use
# SealedSecrets/External Secrets. Este arquivo só documenta as chaves esperadas.
apiVersion: v1
kind: Secret
metadata:
  name: goverse-secrets
  namespace: goverse
type: Opaque
stringData:
  database-url: postgres://<usuario>:<senha>@<host>:5432/goverse?sslmode=require
  jwt-private-key: "<conteúdo do private.pem, ver deploy/k8s/README.md>"
  google-client-id: ""       # opcional
  google-client-secret: ""   # opcional
