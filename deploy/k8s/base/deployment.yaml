# Duas réplicas: o chat liga as réplicas por LISTEN/NOTIFY no Postgres (GOVERSE_CHAT_BUS=postgres),
# então usuários em pods diferentes se veem. Limites e riscos: docs/chat-migration.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goverse
  labels: {app.kubernetes.io/name: goverse}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: goverse}
  template:
    metadata:
      labels: {app.kubernetes.io/name: goverse}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: goverse
          image: ghcr.io/felipefeliperenan/goverse
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: goverse-config}
          env:
            - name: GOVERSE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: goverse-secrets, key: database-url}}
            - name: GOOGLE_CLIENT_ID
              valueFrom: {secretKeyRef: {name: goverse-secrets, key: google-client-id, optional: true}}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: goverse-secrets, key: google-client-secret, optional: true}}
          volumeMounts:
            - {name: jwt-key, mountPath: /keys, readOnly: true}
            - {name: spool, mountPath: /spool}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
            failureThreshold: 30     # migrations rodam no boot
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        # Spool de mensagens quando o banco cai. emptyDir sobrevive a restart do contêiner, mas NÃO a
        # reagendamento/eviction do pod; para garantia total use um PVC por pod (StatefulSet).
        - name: spool
          emptyDir: {sizeLimit: 256Mi}
        - name: jwt-key
          secret:
            secretName: goverse-secrets
            items:
              - {key: jwt-private-key, path: private.pem}
            defaultMode: 0440
