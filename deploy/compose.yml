# Stack de desenvolvimento do monolito: app + Postgres + observabilidade (Grafana LGTM).
# Uso: docker compose -f deploy/compose.yml up --build
# Grafana: http://localhost:3000 (admin/admin) -> Explore: Tempo (traces), Loki, Prometheus.
services:
  # Gera a chave RSA da sessão uma única vez (fica no volume "keys"). Só para desenvolvimento.
  keygen:
    image: alpine:3.20
    command: >
      sh -c "[ -f /keys/private.pem ] ||
      (apk add --no-cache openssl >/dev/null &&
      openssl genpkey -algorithm RSA -out /keys/private.pem -pkeyopt rsa_keygen_bits:2048 &&
      chmod 644 /keys/private.pem)"
    volumes:
      - keys:/keys

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: goverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goverse}
      POSTGRES_DB: goverse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goverse -d goverse"]
      interval: 5s
      timeout: 5s
      retries: 10

  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"   # Grafana
      - "4318:4318"   # OTLP/HTTP

  goverse:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully
    environment:
      GOVERSE_ENV: dev
      GOVERSE_JWT_PRIVATE_KEY_PATH: /keys/private.pem
      GOVERSE_CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      GOVERSE_DATABASE_URL: postgres://goverse:${POSTGRES_PASSWORD:-goverse}@postgres:5432/goverse?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    volumes:
      - keys:/keys:ro
    ports:
      - "8080:8080"

volumes:
  keys:
  pgdata:
