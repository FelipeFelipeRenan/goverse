# Stack de desenvolvimento do monolito: app + Postgres + observabilidade (Grafana LGTM).
# Uso: docker compose -f deploy/compose.yml up --build
# Grafana: http://localhost:3000 (admin/admin) -> Explore: Tempo (traces), Loki, Prometheus.
services:
  # Gera a chave RSA da sessão uma única vez (fica no volume "keys"). Só para desenvolvimento.
  keygen:
    image: alpine:3.20
    command: >
      sh -c "[ -f /keys/private.pem ] ||
      (apk add --no-cache openssl >/dev/null &&
      openssl genpkey -algorithm RSA -out /keys/private.pem -pkeyopt rsa_keygen_bits:2048 &&
      chmod 644 /keys/private.pem);
      mkdir -p /spool && chown 65532:65532 /spool"
    volumes:
      - keys:/keys
      - spool:/spool

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: goverse
      POSTGRES_PASSWORD: ${GOVERSE_POSTGRES_PASSWORD:-goverse}
      POSTGRES_DB: goverse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goverse -d goverse"]
      interval: 5s
      timeout: 5s
      retries: 10

  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"   # Grafana
      - "4318:4318"   # OTLP/HTTP
    volumes:
      # Dashboard "Goverse" já provisionado (Grafana -> Dashboards).
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - ./grafana/goverse.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/goverse.json:ro

  goverse:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully
    environment:
      GOVERSE_ENV: dev
      GOVERSE_JWT_PRIVATE_KEY_PATH: /keys/private.pem
      GOVERSE_CORS_ORIGINS: ${GOVERSE_CORS_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      # Login com Google (opcional). Coloque no .env da raiz; sem isso /oauth/google/login responde 501.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost/oauth/google/callback}
      GOVERSE_DATABASE_URL: postgres://goverse:${GOVERSE_POSTGRES_PASSWORD:-goverse}@postgres:5432/goverse?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: "10000"   # padrão é 60s: em dev o dashboard fica mais vivo
      # Mensagens que não puderam ir ao Postgres ficam aqui e são reprocessadas (ver docs/chat-migration.md).
      GOVERSE_CHAT_SPOOL_DIR: /spool
    volumes:
      - keys:/keys:ro
      - spool:/spool
    ports:
      # Porta 80 por padrão: é onde o frontend espera a API (http://localhost), como era no Traefik.
      # Se a 80 estiver ocupada: GOVERSE_PUBLIC_PORT=8080 make up (e ajuste o frontend).
      - "${GOVERSE_PUBLIC_PORT:-80}:8080"

volumes:
  keys:
  pgdata:
  spool:
