# Stack de desenvolvimento do monolito: app + Postgres + observabilidade (Grafana LGTM).
# Uso: docker compose -f deploy/compose.yml up --build
# Grafana: http://localhost:3000 (admin/admin) -> Explore: Tempo (traces), Loki, Prometheus.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: goverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goverse}
      POSTGRES_DB: goverse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goverse -d goverse"]
      interval: 5s
      timeout: 5s
      retries: 10

  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"   # Grafana
      - "4318:4318"   # OTLP/HTTP

  goverse:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOVERSE_ENV: dev
      GOVERSE_DATABASE_URL: postgres://goverse:${POSTGRES_PASSWORD:-goverse}@postgres:5432/goverse?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    ports:
      - "8080:8080"

volumes:
  pgdata:
