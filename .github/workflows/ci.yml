name: CI (monolito)

on:
  push:
    branches: [main, "feat/**", "chore/**"]
    paths: [go.mod, go.sum, "cmd/**", "internal/**", "deploy/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: [go.mod, go.sum, "cmd/**", "internal/**", "deploy/**", ".github/workflows/ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # só para o commit automático do go.sum em branches de trabalho
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"   # último patch (o go.mod fixa 1.26.0, que tem CVEs da stdlib)
          check-latest: true
      - name: go mod tidy (nos branches de trabalho, commita go.mod/go.sum sozinho)
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            if [ "$EVENT" = "push" ] && [ "$REF_NAME" != "main" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add go.mod go.sum
              git commit -m "chore: go mod tidy [automático]"
              git push
            else
              echo "::error::go.mod/go.sum desatualizados. Rode 'go mod tidy' e commite."
              git diff go.mod go.sum
              exit 1
            fi
          fi
      - run: gofmt -l cmd internal | tee /dev/stderr | (! grep .)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: Vulnerabilidades
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t goverse:ci .

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Sobe app + Postgres (sem o Grafana, que é pesado)
        run: docker compose -f deploy/compose.yml up -d --build goverse
      - name: Fluxo cadastro -> login -> CSRF -> perfil
        run: ./deploy/smoke.sh
      - name: Backup e restore (ida e volta)
        run: |
          before=$(docker compose -f deploy/compose.yml exec -T postgres psql -U goverse -d goverse -tAc "select count(*) from identity.users")
          ./deploy/backup.sh /tmp/backups
          GOVERSE_ASSUME_YES=1 ./deploy/restore.sh /tmp/backups/goverse-*.dump
          ./deploy/smoke.sh wait
          after=$(docker compose -f deploy/compose.yml exec -T postgres psql -U goverse -d goverse -tAc "select count(*) from identity.users")
          echo "usuários antes=$before depois=$after"
          [ "$before" = "$after" ] && [ "$before" -gt 0 ]
      - name: Logs do app (se falhou)
        if: failure()
        run: docker compose -f deploy/compose.yml logs --no-color goverse postgres keygen
      - name: Derruba
        if: always()
        run: docker compose -f deploy/compose.yml down -v

  observability:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Sobe a stack completa (com Grafana LGTM)
        run: docker compose -f deploy/compose.yml up -d --build
      - name: Gera tráfego
        run: ./deploy/smoke.sh
      - name: Métricas chegam ao Grafana e o dashboard está provisionado
        run: ./deploy/check-observability.sh
      - name: Logs (se falhou)
        if: failure()
        run: docker compose -f deploy/compose.yml logs --no-color goverse lgtm | tail -200
      - name: Derruba
        if: always()
        run: docker compose -f deploy/compose.yml down -v

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renderiza os overlays (kustomize embutido no kubectl)
        run: |
          kubectl kustomize deploy/k8s/base > /tmp/base.yaml
          kubectl kustomize deploy/k8s/overlays/in-cluster-postgres > /tmp/pg.yaml
      - name: Valida contra o schema do Kubernetes
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /tmp kubeconform
          /tmp/kubeconform -strict -summary /tmp/base.yaml /tmp/pg.yaml
