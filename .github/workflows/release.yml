name: Release (imagem)

on:
  push:
    branches: [main]
    paths: [go.mod, go.sum, "cmd/**", "internal/**", "deploy/Dockerfile"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/felipefeliperenan/goverse:latest
            ghcr.io/felipefeliperenan/goverse:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
